  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#79542e" stroke-width="1.2" transform="rotate(30 16 16)" fill="none"/>
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#79542e" stroke-width="1.2" transform="rotate(60 16 16)" fill="none"/>
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#79542e" stroke-width="1.2" transform="rotate(90 16 16)" fill="none"/>
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#79542e" stroke-width="1.2" transform="rotate(120 16 16)" fill="none"/>
  <ellipse cx="16" cy="16" rx="13" ry="5" stroke="#79542e" stroke-width="1.2" transform="rotate(150 16 16)" fill="none"/>
